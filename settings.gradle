pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
        // jcenter() 已移除，因为它已停止维护
    }
}

dependencyResolutionManagement {
    // 修改点：将 FAIL_ON_PROJECT_REPOS 改为 PREFER_SETTINGS
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        
        // --- 🌐 官方源 (稳定首选) ---
        // 将 mavenCentral() 和 google() 放在前面，优先使用官方源
        mavenCentral()
        google()
        
        // --- 📦 本地库 (你的私有文件) ---
        flatDir {
            dirs "$rootDir/app/libs", "$rootDir/quickjs/libs"
        }
        
        // --- 🔗 第三方远程库 (特定配置) ---
        
        // 1. JitPack (GitHub 开源库，如 fongmi/Common)
        // 注意：这里必须用 https，且不需要 allowInsecureProtocol
        maven {
            url "https://jitpack.io"
        }
        
        // 2. 4thline (DLNA 库)
        // 注意：这个网站只支持 http，所以必须单独写在一个块里，并声明 allowInsecureProtocol
        maven {
            url "http://4thline.org/m2"
            allowInsecureProtocol = true 
        }
    }
}

// --- 📂 模块包含 ---
include ':app'
include ':hook'
include ':tvbus'
include ':zlive'
include ':catvod'
include ':quickjs'
include ':thunder'
include ':youtube'
include ':jianpian'
include ':forcetech'
include ':ijkplayer'

rootProject.name = "TV"
