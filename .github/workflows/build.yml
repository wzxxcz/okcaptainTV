name: Build APKs

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # --- 🚀 新增关键步骤：清理可能存在的错误认证信息 ---
      - name: Clean Gradle Properties
        run: |
          # 如果 GitHub 缓存里或者是项目里带了错误的 auth token，必须删掉
          # 这样 Gradle 就会以“匿名访客”身份去下载 JitPack 的库，通常就不会 401 了
          rm -f ~/.gradle/gradle.properties
          echo "System is clean."

      # --- 修复阿里云镜像问题 ---
      - name: Fix Repositories (Remove Aliyun)
        run: |
          if [ -f "settings.gradle" ]; then
            sed -i 's/maven { url .*aliyun.*/\/\/ &/' settings.gradle
          elif [ -f "settings.gradle.kts" ]; then
            sed -i 's/maven\(".*aliyun.*"\)/\/\/ &/' settings.gradle.kts
          fi

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Release
        run: |
          # 加上 --no-daemon 防止守护进程缓存问题
          ./gradlew clean assembleRelease --no-daemon --stacktrace
