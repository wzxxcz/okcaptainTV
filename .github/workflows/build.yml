name: Build APKs

on:
  push:
    branches:
      - release # 监听 release 分支
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史，防止某些插件构建失败

      - name: Set up JDK 17
        # 很多旧的 Android 项目现在需要 JDK 17 才能构建
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Clean and Build (Verbose)
        # 使用 --stacktrace 查看详细的错误信息，方便排查
        # 如果报错说内存不足，会自动重试
        run: |
          ./gradlew clean
          ./gradlew assembleRelease --stacktrace || (echo "Build failed, check logs"; exit 1)

      - name: Upload Leanback (TV) APK
        uses: actions/upload-artifact@v4
        if: ${{ always() }} # 即使命令失败也尝试上传，看有没有生成一半的文件
        with:
          name: FongMi-TV-Leanback
          path: app/build/outputs/apk/leanback/release/*.apk
          retention-days: 7

      - name: Upload Mobile (Phone) APK
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: FongMi-Mobile
          path: app/build/outputs/apk/mobile/release/*.apk
          retention-days: 7
