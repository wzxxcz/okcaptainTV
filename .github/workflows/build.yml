name: Build APKs

on:
  push:
    branches:
      - release 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # --- 🚀 新增步骤：自动修复 settings.gradle ---
      # 因为阿里云在境外访问不稳定且可能报错，这里用 sed 命令自动注释掉阿里云镜像
      - name: Fix Repositories (Remove Aliyun)
        run: |
          # 备份原文件
          cp settings.gradle settings.gradle.bak
          # 使用正则替换，注释掉包含 aliyun 的行
          sed -i 's|.*maven { url "https://maven.aliyun.com.*|// &|g' settings.gradle
          # 显示修改后的内容，方便确认
          echo "Modified settings.gradle:"
          cat settings.gradle

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Clean and Build
        run: |
          # 先清理
          ./gradlew clean
          # 再构建，加上 --no-daemon 防止 CI 环境下的守护进程问题
          ./gradlew assembleRelease --stacktrace

      - name: Upload Leanback (TV) APK
        uses: actions/upload-artifact@v4
        if: ${{ success() }} # 只有成功才上传，避免上传半成品
        with:
          name: FongMi-TV-Leanback
          path: app/build/outputs/apk/leanback/release/*.apk

      - name: Upload Mobile (Phone) APK
        uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: FongMi-Mobile
          path: app/build/outputs/apk/mobile/release/*.apk
